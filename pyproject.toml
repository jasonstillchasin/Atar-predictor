[project]
name = "atar-predictor"
version = "0.1.0"
description = "Estimate an NSW ATAR range from Year 11/12 school assessment results using UAC scaling statistics"
authors = [
    { name = "hi", email = "lij62766@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
atar-predict = "atar_predictor.cli:app"
atar-web = "atar_predictor.web.app:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]
