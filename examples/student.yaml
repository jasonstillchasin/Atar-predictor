# Example student profile. Course names must match UAC Table A3 (e.g. "Mathematics Advanced").
#
# Per task: weight is % of that year's internal assessment. mark can be a % (out_of defaults
# to 100) or a raw score with out_of. Leave mark out for tasks not yet sat.
# Optional per task: rank / rank_of, or cohort_mean / cohort_sd (same scale as mark).
# Per course: cohort_size, and rank if you know your current overall course rank.

